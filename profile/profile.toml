# Fashion Scout: style profile
# The weekly run reads this first. Edit freely; the GitHub app works on a phone.
# Things the scout LEARNS (your real size per brand, brands/categories you like or skip, wardrobe progress)
# live in data/history.json, not here.

[me]
section = "men"
climate = "north-india"        # north-india | humid-coastal | mild-plateau
height_cm = 170
weight_kg = 71
build = "average"
notes = "Likes clothes a bit loose; never tight. Sits between M and L depending on brand and cut."

[sizes]
# Ranges are fine: an item qualifies if ANY of these sizes is in stock, and the email says which.
# A "bought L" reply narrows it to L for that brand only.
top = ["M", "L"]               # tees, shirts, knits, jackets; joggers/cargos sold S/M/L use this too
chest_in = []                  # leave empty: derived from M/L (40/42) when a store labels shirts by chest
waist_in = [32]                # jeans/trousers
shoe_uk = [9]

# Per-brand exceptions, if you learn one before the scout does:
# [sizes.brand."Snitch"]
# top = "M"
[sizes.brand]

[fit]
# Soft preferences (nudge up): looser, easy cuts
prefer = ["relaxed", "oversized", "boxy", "regular fit", "loose", "straight fit", "wide leg", "baggy", "drop shoulder", "easy fit", "comfort fit"]
# Soft dislikes (nudge down): close cuts are allowed only if everything else is great
soft_avoid = ["slim fit", "slim-fit", "tapered fit", "fitted"]
# Hard no: dropped outright
avoid = ["skinny", "super skinny", "muscle fit", "extra slim", "super slim", "body fit", "bodycon"]

[style]
vibes = ["minimal", "smart-casual", "streetwear"]
# No colour preferences on purpose: colour never filters or scores.
# Hard dealbreakers (dropped):
avoid = ["distressed", "ripped", "sequin", "satin", "shiny", "metallic", "anime", "marvel", "disney", "cartoon", "balaclava",
         "harry potter", "hedwig", "naruto", "pokemon", "star wars", "batman", "superman", "spider-man", "looney tunes", "friends tv"]
# Soft dislikes (pushed down, not dropped):
dislike = ["slogan", "typography", "all over print", "big logo"]

[quality]
# "Price must be justified by quality. No luxury."
philosophy = "value-for-quality"
hard_cap_inr = 9000            # per clothing item; above this counts as luxury and never shows
footwear_cap_inr = 10000
avoid_materials = ["acrylic", "pu leather", "faux leather"]

[shopping]
avoid_stores = []              # no brand preference on purpose
picks_per_week = 5             # 4 focus picks + 1 wildcard
mode = "build-from-scratch"    # fill data/capsule.json essentials first; pair picks with each other and with what's been bought

[delivery]
email = "rahullko0@gmail.com"
weekday = "Sunday"
